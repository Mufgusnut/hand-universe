<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Universe</title>
<style>
  :root { --ink: #e8ecff; --dim: #8a93b8; --glow: #7fd6ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #02030a; color: var(--ink); overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #intro { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
    background: radial-gradient(ellipse at center, rgba(2,3,10,.35), rgba(2,3,10,.9)); transition: opacity .8s; z-index: 5; }
  #intro.hidden { opacity: 0; pointer-events: none; }
  #intro h1 { font-weight: 200; font-size: clamp(34px, 7vw, 84px); letter-spacing: .28em; margin: 0 0 12px;
    text-indent: .28em; text-shadow: 0 0 40px rgba(127,214,255,.55); }
  #intro p { color: var(--dim); font-size: clamp(14px, 1.6vw, 18px); max-width: 560px; margin: 0 auto 34px; line-height: 1.6; }
  .btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  button { font: inherit; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
    padding: 14px 28px; border-radius: 999px; border: 1px solid rgba(127,214,255,.6); color: var(--ink);
    background: rgba(127,214,255,.12); transition: all .25s; }
  button:hover { background: rgba(127,214,255,.28); box-shadow: 0 0 34px rgba(127,214,255,.45); }
  button.ghost { border-color: rgba(255,255,255,.2); background: transparent; color: var(--dim); }
  button.ghost:hover { color: var(--ink); background: rgba(255,255,255,.08); box-shadow: none; }
  #status { margin-top: 26px; min-height: 22px; color: var(--glow); font-size: 14px; letter-spacing: .06em; }
  #status.err { color: #ff9a8a; }

  #hud { position: fixed; left: 0; right: 0; bottom: 18px; display: flex; flex-direction: column; align-items: center;
    gap: 10px; pointer-events: none; opacity: 0; transition: opacity 1s; z-index: 3; padding: 0 16px; }
  #hud.on { opacity: 1; }
  #legend { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip { font-size: 12.5px; letter-spacing: .04em; color: var(--dim); padding: 7px 13px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.1); background: rgba(6,8,20,.55); backdrop-filter: blur(6px); transition: all .2s; }
  .chip b { color: var(--ink); font-weight: 600; margin-right: 6px; }
  .chip.active { color: #fff; border-color: var(--glow); background: rgba(127,214,255,.22);
    box-shadow: 0 0 22px rgba(127,214,255,.45); transform: translateY(-2px); }
  #hint { font-size: 12px; color: var(--dim); letter-spacing: .05em; text-align: center; }

  #cam { position: fixed; right: 18px; top: 18px; width: 200px; border-radius: 12px; transform: scaleX(-1);
    opacity: 0; border: 1px solid rgba(255,255,255,.15); transition: opacity .6s; z-index: 2; pointer-events: none; }
  #cam.on { opacity: .55; }
  #palette { position: fixed; left: 20px; top: 18px; font-size: 12px; letter-spacing: .3em; text-transform: uppercase;
    color: var(--dim); z-index: 3; opacity: 0; transition: opacity 1s; }
  #palette.on { opacity: 1; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="stage"></canvas>
<video id="cam" playsinline muted></video>
<div id="palette"></div>

<div id="intro">
  <div>
    <h1>HAND UNIVERSE</h1>
    <p>Step back, raise your hands, and conjure. Your webcam video is processed entirely in this browser tab and never leaves your computer.</p>
    <div class="btns">
      <button id="startCam">Enable camera</button>
      <button id="startMouse" class="ghost">Try with mouse</button>
    </div>
    <div id="status"></div>
  </div>
</div>

<div id="hud">
  <div id="legend">
    <span class="chip" data-g="open"><b>Open hand</b>explode</span>
    <span class="chip" data-g="fist"><b>Fist</b>gather, then open for a supernova</span>
    <span class="chip" data-g="pinch"><b>Pinch</b>grow a galaxy</span>
    <span class="chip" data-g="point"><b>Point</b>draw with light</span>
    <span class="chip" data-g="peace"><b>Peace sign</b>change colors</span>
    <span class="chip" data-g="portal"><b>Both hands open</b>portal</span>
  </div>
  <div id="hint"></div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
